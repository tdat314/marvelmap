{% extends "layout.html" %}
{% block content %}
<div class="pad">
  <h2>{{ 'New Mission' if not m else 'Edit Mission' }}</h2>
  <form method="post" action="{{ url_for('mission_new') if not m else url_for('mission_edit', mid=m['id']) }}">
    <label>Title<br><input name="title" required value="{{ m['title'] if m }}"></label><br><br>

    <label>Tags (comma)<br><input name="tags" value="{{ m['tags'] if m }}"></label><br><br>

    <label>Status<br>
      <select name="status">
        {% for s in ['draft','open','scheduled','published','locked','in-progress','complete','archived'] %}
          <option value="{{s}}" {% if m and m['status']==s %}selected{% endif %}>{{s}}</option>
        {% endfor %}
      </select>
    </label><br><br>

    <label>Difficulty<br>
      <select name="difficulty">
        {% for d in ['easy','standard','hard'] %}
          <option value="{{d}}" {% if m and m['difficulty']==d %}selected{% endif %}>{{d}}</option>
        {% endfor %}
      </select>
    </label><br><br>

    <label>Region hint (text)<br><input name="region_hint" value="{{ m['region_hint'] if m }}"></label><br><br>

    <label>Global X (0..1)<br>
      <input name="x" type="number" step="0.001" min="0" max="1" value="{{ m['x'] if m else 0.5 }}">
    </label><br><br>

    <label>Global Y (0..1)<br>
      <input name="y" type="number" step="0.001" min="0" max="1" value="{{ m['y'] if m else 0.5 }}">
    </label><br><br>

    <label>Brief (player)<br>
      <textarea name="brief" rows="4">{{ m['brief'] if m }}</textarea>
    </label><br><br>

    <label>Dossier (GM)<br>
      <textarea name="dossier" rows="6">{{ m['dossier'] if m }}</textarea>
    </label><br><br>

    <button>Save</button>
  </form>
</div>
{% endblock %}
